version: "2"
run:
  timeout: 5m

# Linter-specific settings and configuration.
linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - stylecheck

# Configuration for specific issues or rules.
issues:
  max-same-issues: 10
  # --- THIS SECTION IS NOW CORRECTED ---
  exclude:
    # Rule #1: This is a list item, starting with a hyphen.
    # It disables 'errcheck' for any file in the 'unit_test/' directory.
      path: unit_test/.* # Corrected: Use forward slash and the full pattern
      linters:
        - errcheck

    # Rule #2: This is a separate list item, with its own hyphen.
    # It disables 'funlen' for any file in the 'unit_test/' directory.
      path: unit_test/.*
      linters:
        - funlen

# Output configuration.
output:
  format:
    colored-line: true
