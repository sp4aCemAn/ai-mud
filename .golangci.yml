version: "2"
run:
  timeout: 5m

# Linter-specific settings and configuration.
linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - stylecheck

# Configuration for specific issues or rules.
# Please DELETE the entire 'issues:' block from your file and REPLACE it with this one.
issues:
  max-same-issues: 10
  # The 'exclude:' key marks the beginning of the list of rules.
  exclude:
    # This hyphen (-) starts the FIRST rule. It must be indented.
    - description: "Allow long functions in tests"
      # 'path' and 'linters' are indented further, under the hyphen.
      path: unit_test/.*
      linters:
        - funlen

    # This hyphen (-) starts the SECOND rule.
    # CRITICAL: It must have the EXACT SAME indentation as the first hyphen.
    - description: "Don't require error checking in tests"
      path: unit_test/.*
      linters:
        - errcheck# Output configuration.
output:
  format:
    colored-line: true
