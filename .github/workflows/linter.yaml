name: Go Linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci-lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out your code (actions pinned to commit SHAs — supply-chain;
      # the tag in the comment is the resolved release, bump it via Dependabot)
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Set up the Go environment
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable

      # Step 3: Run the golangci-lint action
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          # v2.13.1 bundles go1.27-era support; anything ≥ v2.4.0 is the
          # first line built with go1.25 (the repo's go.mod target)
          version: v2.13.1
